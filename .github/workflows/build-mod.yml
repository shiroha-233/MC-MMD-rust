# 26.2 全流程自动构建：Rust 原生引擎编译 → Gradle 打包 → 产物上传/发布。
#
# 两种打包模式：
#   A) 单平台（每个平台 job 自带该平台原生库的完整 mod jar）
#   B) universal（收集所有平台原生库 → common/src/main/resources/natives/ → 打一个全平台 jar）
#
# 平台：windows-x64 / linux-x64 / macos-x64（macos-latest 为 arm64 runner，
#       交叉编译 x86_64-apple-darwin）。框架矩阵当前仅 fabric（26.2 迁移范围；
#       neoforge 完成后在框架矩阵追加即可，并放开 settings.gradle 的 include）。
# 注意：bullet3 是原始项目的 git submodule 但源码未入库，CI 按 tag 3.27 拉取。
name: Build & Release (26.2)

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main, 26.2]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==================== Rust 原生库构建（每个平台一个 artifact） ====================
  build-rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            native: mmd_engine.dll
            cargo-target: ""
          - platform: linux-x64
            os: ubuntu-latest
            native: libmmd_engine.so
            cargo-target: ""
          - platform: macos-x64
            os: macos-latest
            native: libmmd_engine.dylib
            cargo-target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # bullet3 源码不在仓库（原 submodule 未入库），按原项目所用版本拉取。
      # 注意：bullet3 的持续版本号（VERSION 文件）为 3.27 但并未打 tag（最新 tag 为 3.25），
      # 因此克隆默认分支 master（VERSION=3.27，与原项目一致）。
      - name: Fetch Bullet3 sources
        shell: bash
        run: |
          rm -rf rust_engine/deps/bullet3
          git clone --depth 1 https://github.com/bulletphysics/bullet3.git \
            rust_engine/deps/bullet3
          test -d rust_engine/deps/bullet3/src/LinearMath \
            && echo "bullet3 ready"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cargo-target }}

      - name: Build Rust native (${{ matrix.platform }})
        shell: bash
        run: |
          if [ -n "${{ matrix.cargo-target }}" ]; then
            cargo build --release --locked \
              --manifest-path rust_engine/Cargo.toml \
              --target ${{ matrix.cargo-target }}
            mkdir -p rust_engine/target/release
            cp rust_engine/target/${{ matrix.cargo-target }}/release/${{ matrix.native }} \
              rust_engine/target/release/
          else
            cargo build --release --locked --manifest-path rust_engine/Cargo.toml
          fi
          test -f rust_engine/target/release/${{ matrix.native }} \
            && echo "native library ready"

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: rust_engine/target/release/${{ matrix.native }}
          if-no-files-found: error

  # ==================== 单平台完整 mod jar（自带本平台原生库） ====================
  build-mod:
    needs: build-rust
    strategy:
      fail-fast: false
      matrix:
        framework: [fabric]
        include:
          - platform: windows-x64
            os: windows-latest
            native: mmd_engine.dll
          - platform: linux-x64
            os: ubuntu-latest
            native: libmmd_engine.so
          - platform: macos-x64
            os: macos-latest
            native: libmmd_engine.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract mod version
        id: version
        shell: bash
        run: |
          MOD_VERSION=$(grep "version = '" build.gradle | head -1 | sed "s/.*version = '//" | sed "s/'.*//")
          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          echo "提取到模组版本: $MOD_VERSION"

      # 复用 build-rust 的原生库产物：放入 target/release 后，
      # buildRustEngine（onlyIf 原生库不存在）自动跳过 cargo，无需 bullet3。
      - name: Download native library
        uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: rust_engine/target/release

      - name: Verify native library present
        shell: bash
        run: |
          find rust_engine/target/release -type f
          test -n "$(find rust_engine/target/release -type f -name '${{ matrix.native }}')" \
            && echo "native library ready for gradle"

      - name: Build mod with Gradle (${{ matrix.framework }})
        shell: bash
        run: ./gradlew :${{ matrix.framework }}:build --no-daemon -x test

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: mmdskin-${{ matrix.framework }}-${{ matrix.platform }}-${{ steps.version.outputs.mod_version }}
          path: ${{ matrix.framework }}/build/libs/*.jar
          if-no-files-found: error

  # ==================== Universal jar（收集所有平台原生库 → 单一全平台 jar） ====================
  build-universal:
    needs: build-rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract mod version
        id: version
        shell: bash
        run: |
          MOD_VERSION=$(grep "version = '" build.gradle | head -1 | sed "s/.*version = '//" | sed "s/'.*//")
          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          echo "提取到模组版本: $MOD_VERSION"

      - name: Download all native libraries
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-libs

      - name: Copy natives into resources
        shell: bash
        run: |
          # 目录结构必须与 NativeLibraryLoader 一致（/natives/<archDir>/<file>）
          mkdir -p common/src/main/resources/natives/windows-x64
          mkdir -p common/src/main/resources/natives/linux-x64
          mkdir -p common/src/main/resources/natives/macos-x64
          cp native-libs/native-windows-x64/mmd_engine.dll   common/src/main/resources/natives/windows-x64/
          cp native-libs/native-linux-x64/libmmd_engine.so   common/src/main/resources/natives/linux-x64/
          cp native-libs/native-macos-x64/libmmd_engine.dylib common/src/main/resources/natives/macos-x64/
          find common/src/main/resources/natives -type f

      - name: Build universal mod (fabric)
        shell: bash
        run: ./gradlew :fabric:build --no-daemon -x test -PskipRustBuild=true

      - name: Rename JAR to universal
        shell: bash
        run: |
          cd fabric/build/libs
          for f in mmdskin-fabric-*.jar; do
            case "$f" in *-sources*|*-raw*) continue;; esac
            mv "$f" "mmdskin-fabric-${{ steps.version.outputs.mod_version }}-universal.jar"
          done

      - name: Upload universal mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: mmdskin-fabric-universal-${{ steps.version.outputs.mod_version }}
          path: fabric/build/libs/*universal.jar
          if-no-files-found: error

  # ==================== 统一发布（仅 tag） ====================
  release:
    needs: [build-mod, build-universal]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*.jar
          generate_release_notes: true
