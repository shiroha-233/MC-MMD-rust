// 负责 Forge 平台的依赖装配、阴影打包与重映射发布。
plugins {
	id 'com.gradleup.shadow' version '8.3.6'
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    forge {
        mixinConfig "mmdskin-forge.mixins.json"
    }
    // 启用 mixin refmap 生成
    mixin {
        defaultRefmapName = "mmdskin-forge-refmap.json"
    }
    runs {
        client {
            client()
            name "Forge Client"
            runDir "run/client"
            programArgs "--username", "Player1"
        }
        client2 {
            client()
            name "Forge Client 2"
            runDir "run/client2"
            programArgs "--username", "Player2"
        }
        server {
            server()
            name "Forge Server"
            runDir "run/server"
        }
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it conflicts with Loom.
    shadowBundle
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

shadowJar {
    exclude "architectury.common.json"
    exclude "fabric.mod.json"
    configurations = [project.configurations.shadowCommon, project.configurations.shadowBundle]
    archiveClassifier.set("dev-shadow")
    relocate "javazoom", "com.shiroha.mmdskin.shadow.javazoom"
    
    // 包含 common 模块的资源（原生库、默认动画等）
    from(project(":common").sourceSets.main.resources)
    
    // 排除不需要的文件
    exclude 'META-INF/versions/**'
    
    // 强制更新 META-INF/services 里的类名
    mergeServiceFiles()
    
    // 排除 module-info.class 避免 JPMS 冲突
    exclude 'module-info.class'
}


remapJar {
	inputFile.set shadowJar.archiveFile
	dependsOn shadowJar
}

jar {
	archiveClassifier.set("dev")
	from("${rootProject.projectDir}/LICENSE") {
		rename { "${it}_${base.archivesName.get()}"}
	}
	
	manifest {
		attributes([
			'Specification-Title'     : 'Template Mod',
			'Specification-Vendor'    : 'Template Author',
			'Specification-Version'   : '1',
			'Implementation-Title'    : project.name,
			'Implementation-Version'  : project.version,
			'Implementation-Vendor'   : 'Template Author'
		])
	}
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        minecraft_version: '1.20.1',
        minecraft_version_range: '[1.20.1,1.21)',
        forge_version: project.forge_version,
        forge_version_range: '[47,48)',
        loader_version_range: '[47,)',
        mod_id: 'mmdskin',
        mod_name: '3D Skin Layers',
        mod_version: project.version,
        mod_authors: 'shiroha233, kjkjkAIStudio(原作者), asuka-mio, Gengorou-C',
        mod_description: 'A mod that replaces Minecraft entity rendering with MMD models'
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

// 可选的本地 TaCZ 生产包，用于 Forge 开发环境兼容验证。
def defaultTaczDevJar = rootProject.file(".tmp-tacz/mods/tacz-1.20.1-1.1.6-hotfix.jar")
def configuredTaczDevJar = providers.gradleProperty("tacz_dev_jar").orNull
def taczDevJar = configuredTaczDevJar == null || configuredTaczDevJar.isBlank()
        ? defaultTaczDevJar
        : rootProject.file(configuredTaczDevJar)
def taczDevRuntimeDir = layout.buildDirectory.dir("tacz-dev-runtime")
def prepareTaczDevRuntime = tasks.register("prepareTaczDevRuntime", Sync) {
    onlyIf { taczDevJar.isFile() }
    from({ zipTree(taczDevJar) }) {
        include("META-INF/jarjar/*.jar")
        eachFile { details ->
            details.path = details.name
        }
        includeEmptyDirs = false
    }
    into(taczDevRuntimeDir)
}

tasks.withType(JavaExec).configureEach {
    dependsOn(prepareTaczDevRuntime)
}

dependencies {
    // Common 模块 - 添加源代码到编译路径
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive false }

    // JLayer 在 dev 运行时保持可见，但发布物改为私有化阴影打包。
    common("javazoom:jlayer:1.0.1") { transitive = false }
    shadowBundle("javazoom:jlayer:1.0.1") { transitive = false }

    // Skiko / Skia（轮盘 UI 平滑渲染）

    // ImGui workbench（开发/本地运行）

    // Forge 平台
    forge "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Architectury API - 使用 Jar-in-Jar 内嵌
    modApi("dev.architectury:architectury-forge:9.2.14")
    include("dev.architectury:architectury-forge:9.2.14")
    
    // TouhouLittleMaid - 可选依赖，用于联动
    modCompileOnly("maven.modrinth:touhou-little-maid:1.5.0-forge+mc1.20.1")
    modLocalRuntime("maven.modrinth:touhou-little-maid:1.5.0-forge+mc1.20.1")

    // 本地 TaCZ 生产包必须经 Loom 重映射后才能进入命名开发环境。
    if (taczDevJar.isFile()) {
        modLocalRuntime(files(taczDevJar))
        // Loom 的 classpath Mod 不会展开 Jar-in-Jar，将未混淆依赖提取为真实文件后加入运行时。
        runtimeOnly(files(fileTree(taczDevRuntimeDir) {
            include("*.jar")
        }).builtBy(prepareTaczDevRuntime))
    }
    
    // Cloth Config API - 配置界面
    modApi("me.shedaniel.cloth:cloth-config-forge:11.1.136")
}

// Source JAR 组装（合并 common 源码）
sourcesJar {
    // Avoid duplicate entries when merging common sources
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/mods.toml'
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

sourceSets {
    main {
        java {
            // Avoid JPMS split-package: keep top-level network package only in common
        }
        resources {
            exclude 'assets/mmdskin/lang/*.json'
        }
    }
}
