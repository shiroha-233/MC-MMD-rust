// NeoForge 平台模块（Minecraft 26.3 移植版）
//
// 26.x 迁移要点（相对 1.21.5 形态的 neoforge/build.gradle）：
//   * 放弃 Architectury：architectury-neoforge 最高只有 21.0.5（对应 MC 1.21.x），
//     没有 26.x 版本。这是 26.3 上必须换用官方 net.neoforged.moddev 插件的根本原因。
//     连带地：common 不再是独立 Gradle 模块，源码/资源目录直接挂到 main sourceSet 上
//     （与 fabric 端做法一致）。
//   * moddev 自己管理 Minecraft + NeoForge 的编译期依赖，所以这里**不能**再声明
//     `minecraft "com.mojang:minecraft:..."`（根 build.gradle 里已经按平台拆开）。
//   * 26.x 的 Minecraft 未混淆：不需要 remapJar，也不需要 refmap。
//   * Cloth Config 通过 moddev 的 jarJar 配置内嵌（替代旧 Architectury 的 include）。

plugins {
	id 'net.neoforged.moddev'
}

def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')

neoForge {
	// 26.3 系列最新版本。
	// 用 enable { } 块而不是 version = "..."，是为了同时打开 disableRecompilation：
	// 跳过 NeoForm 的反编译/重编译流水线，产物等价（NeoForge 二进制补丁照常应用），
	// 但省掉数十分钟的反编译时间与数 GB 的内存占用。本机没有 26.3 的 NeoForge 实例，
	// 只需要编译期可用的 jar。
	enable {
		version = "26.3.0.97"
		disableRecompilation = true
	}

	runs {
		client {
			client()
			gameDirectory = project.file('run/client')
			programArguments.addAll('--username', 'Player1')
			if (isWindows) {
				jvmArguments.add('-Djavax.net.ssl.trustStoreType=Windows-ROOT')
			}
		}
		server {
			server()
			gameDirectory = project.file('run/server')
			if (isWindows) {
				jvmArguments.add('-Djavax.net.ssl.trustStoreType=Windows-ROOT')
			}
		}
	}

	mods {
		mmdskin {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	// Cloth Config API - 配置界面（运行时由 JiJ 内嵌）
	implementation "me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}"
	jarJar(implementation("me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}")) {
		version {
			strictly '[26.3,26.4)'
			prefer "${project.cloth_config_version}"
		}
	}

	// JLayer - MP3 解码器（舞台模式音频播放）
	implementation "javazoom:jlayer:1.0.1"
	jarJar(implementation("javazoom:jlayer:1.0.1")) {
		version {
			strictly '1.0.1'
		}
	}
}

sourceSets {
	main {
		java {
			// 原 common 模块的源码目录直接挂进来（与 fabric 端一致）
			srcDir '../common/src/main/java'
		}
		resources {
			srcDir '../common/src/main/resources'
			// 注意：这里**不能**排除 assets/mmdskin/lang/*.json，
			// 否则语言文件没进 jar → 界面全部显示原始翻译键（gui.mmdskin.xxx）。
			exclude 'pack.mcmeta'
		}
	}
}

tasks.named('processResources', ProcessResources).configure {
	// 与 fabric 端同理：原生库有两个来源（copyRustNativesNeoForge 任务 +
	// CI cp 到 common/src/main/resources/natives/），同相对路径重复会让
	// processResources 因 DuplicatesStrategy.FAIL 失败。两份是同一个 cargo 产物。
	duplicatesStrategy = DuplicatesStrategy.INCLUDE

	def replaceProperties = [
		minecraft_version: '26.3',
		minecraft_version_range: '[26.3,26.4)',
		neoforge_version: '26.3.0.97',
		neoforge_version_range: '[26.3.0,)',
		// NeoForge 26.3 的 FML loader 版本是 12.0.12（loaderVersion 比对的是
		// net.neoforged.fml.FMLVersion.getVersion()），所以下界写 12。
		loader_version_range: '[12,)',
		mod_id: 'mmdskin',
		mod_name: '3D Skin Layers',
		mod_version: project.version,
		mod_authors: 'shiroha233, kjkjkAIStudio, asuka-mio, Gengorou-C',
		mod_description: 'A mod that replaces Minecraft entity rendering with MMD models'
	]

	inputs.properties replaceProperties

	filesMatching(['META-INF/neoforge.mods.toml']) {
		expand replaceProperties
	}
}

jar {
	from("${rootProject.projectDir}/LICENSE") {
		rename { "${it}_${base.archivesName.get()}"}
	}
}
