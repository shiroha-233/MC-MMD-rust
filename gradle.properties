# 项目版本与依赖版本配置
org.gradle.jvmargs=-Xmx2G -Djava.net.preferIPv4Stack=true -Dhttps.protocols=TLSv1.2,TLSv1.3 -Dfile.encoding=UTF-8 -Djdk.tls.client.protocols=TLSv1.2,TLSv1.3
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3

# Mod Properties
maven_group=com.shiroha233.mmdskin

# Dependencies
fabric_version=0.157.0+26.2
architectury_version=21.0.6
cloth_config_version=26.2.155

# 26.x 原版已反混淆（无 mappings），loom-no-remap 处于新版本线，忽略依赖版本校验
loom.ignoreDependencyLoomVersionValidation=true

# mc-vr-api (Vivecraft VR API)

# 运行游戏时的人物名称
minecraft_username=Developer
