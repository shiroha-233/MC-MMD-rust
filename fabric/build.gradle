// Fabric 平台模块（Minecraft 26.3 移植版）
//
// 26.x 迁移要点：
//   * Loom 插件：net.fabricmc.fabric-loom（根 build.gradle 里声明）
//   * modImplementation -> implementation
//   * remapJar -> jar（26.x 未混淆，不需要重映射）
//   * 去掉 shadow 插件：26.x 的成品 jar 只需"类 + 资源 + JiJ"，不需要把整个
//     runtimeClasspath 影子打包进去（那会产出 130MB 巨型 jar，且条目数超过
//     65535 时 Zip64RequiredException 直接失败）。
//   * 去掉 loom.mixin 配置：Loom 1.19.3 起默认不再启用 mixin 注解处理器
//     （MC 26.x 未混淆，不需要 refmap），保留会触发 Gradle 警告。

def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')

loom {
	runs {
		client {
			client()
			name "Fabric Client"
			runDir "run/client"
			if (isWindows) {
				vmArgs "-Djavax.net.ssl.trustStoreType=Windows-ROOT"
			}
			programArgs "--username", "Player1"
			vmArgs "-Xmx2G", "-Xms1G"
		}
		server {
			server()
			name "Fabric Server"
			runDir "run/server"
			if (isWindows) {
				vmArgs "-Djavax.net.ssl.trustStoreType=Windows-ROOT"
			}
		}
	}
}

repositories {
	maven {
		url = "https://api.modrinth.com/maven"
	}
	maven {
		url "https://maven.shedaniel.me/"
		name "Shedaniel Maven"
	}
	maven {
		url = "https://maven.terraformersmc.com/releases/"
		name "TerraformersMC"
	}
	maven {
		url = "https://maven.irisshaders.dev"
		name "Iris Shaders"
	}
	maven {
		url = "https://maven.ladysnake.org/releases"
		name "Ladysnake"
	}
}

dependencies {
	// Fabric Loader
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Cloth Config API - 配置界面
	implementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

	// JLayer - MP3 解码器（舞台模式音频播放），运行时由本平台包私有化
	implementation "javazoom:jlayer:1.0.1"
	include "javazoom:jlayer:1.0.1"

	// 单元测试：模型分发的路径安全 / 分块帧编解码 / 临时目录语义
	// （测试代码不依赖 Minecraft，可直接在纯 JVM 里跑）
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
	}
}

processResources {
	inputs.property "version", project.version

	// 原生库有两个来源：Gradle 的 copyRustNatives 任务写进
	// fabric/build/generated/resources/mmdskin/，而 CI 还会把同一批原生库
	// cp 到 common/src/main/resources/natives/（common 的资源目录也挂在本模块的
	// resources sourceSet 上）。两个 source root 出现同一个相对路径时，
	// Gradle 7+ 的 processResources 默认 DuplicatesStrategy.FAIL 会直接让构建失败
	// （实测：Entry natives/windows-x64/mmd_engine.dll is a duplicate）。
	// 两份内容是同一个 cargo 产物，用 INCLUDE 覆盖即可。
	duplicatesStrategy = DuplicatesStrategy.INCLUDE

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

// 26.x 的 jar 未混淆，不需要 remapJar，也不需要把整个 runtimeClasspath 打包进来
// （那会产出 130MB 的巨型 jar）。成品就是普通 jar 任务：
//   - sourceSets.main.output：类 + 资源（assets/**、mixin 配置、natives/windows-x64/mmd_engine.dll）
//   - META-INF/jars/jlayer-1.0.1.jar：jar-in-jar（javazoom），由 `include` 生成，MC 运行时加载
jar {
	from("${rootProject.projectDir}/LICENSE") {
		rename { "${it}_${base.archivesName.get()}"}
	}
}

sourceSets {
    main {
        java {
            // 原 common 模块的源码目录直接挂进来（单模块化，省掉一次目录搬迁）
            srcDir '../common/src/main/java'
        }
        resources {
            srcDir '../common/src/main/resources'
            // 注意：这里**不能**排除 assets/mmdskin/lang/*.json。
            // 26.3 移植时把它排除了（上游 1.21.5 是 Architectury 多模块，没有这个 exclude），
            // 结果语言文件没进 jar → 界面全部显示原始翻译键（gui.mmdskin.xxx）。
            exclude 'pack.mcmeta'
        }
    }
    test {
        java {
            // 原 common 模块的测试目录同样挂进来
            srcDir '../common/src/test/java'
        }
    }
}
