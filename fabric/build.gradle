// 负责 Fabric 平台的依赖装配、阴影打包与产物合并（26.x 无 remap，loom-no-remap 直出）。
plugins {
	id 'com.gradleup.shadow' version '9.4.2'
}

def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')

architectury {
	platformSetupLoomIde()
	fabric()
}

loom {
	runs {
		client {
			client()
			name "Fabric Client"
			runDir "run/client"
			if (isWindows) {
				vmArgs "-Djavax.net.ssl.trustStoreType=Windows-ROOT"
			}
			programArgs "--username", "Player1"
			vmArgs "-Xmx2G", "-Xms1G"
		}
		client2 {
			client()
			name "Fabric Client 2"
			runDir "run/client2"
			if (isWindows) {
				vmArgs "-Djavax.net.ssl.trustStoreType=Windows-ROOT"
			}
			programArgs "--username", "Player2"
			vmArgs "-Xmx2G", "-Xms1G"
		}
		server {
			server()
			name "Fabric Server"
			runDir "run/server"
			if (isWindows) {
				vmArgs "-Djavax.net.ssl.trustStoreType=Windows-ROOT"
			}
		}
	}
}

configurations {
	common {
		canBeResolved = true
		canBeConsumed = false
	}
	shadowCommon // Don't use shadow from the shadow plugin since it conflicts with Loom.
	shadowBundle {
		canBeResolved = true
		canBeConsumed = false
	}
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentFabric.extendsFrom common
}

repositories {
	maven {
		url = "https://api.modrinth.com/maven"
	}
	maven {
		url "https://maven.shedaniel.me/"
		name "Shedaniel Maven"
	}
	// Sodium 和 Iris 的 Maven 仓库
	maven {
		url "https://maven.terraformersmc.com/releases/"
		name "TerraformersMC"
	}
	// Iris Maven
	maven {
		url "https://maven.irisshaders.dev"
		name "Iris Shaders"
	}
}

dependencies {
	implementation project(":common")
	common(project(path: ":common")) { transitive = false }
	shadowCommon(project(path: ":common")) { transitive = false }
	
	// JLayer 运行时由平台包私有化，避免与其他模组的 JPMS 模块导出冲突。
	common("javazoom:jlayer:1.0.1") { transitive = false }
	shadowBundle("javazoom:jlayer:1.0.1") { transitive = false }
	
	// Fabric Loader（26.x 无反混淆，直接用标准配置）
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	
	// Fabric API
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	
	// Cloth Config API - 配置界面（内嵌到模组中）
	include(implementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	})
	
	// Nashorn 脚本引擎 - Java 21 不再内置，Touhou Little Maid JS 动画需要
	
	// NightConfig - Forge Config API Port 的传递依赖，dev 环境需要显式声明
	
	// mc-vr-api - Vivecraft VR API（软依赖，运行时可选）

	// TouhouLittleMaid Orihime (Fabric 移植版) - 可选依赖，用于联动
	
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

// 26.x 无反混淆：jar 产出原始源码集 + include() 的 jar-in-jar 嵌套，
// shadowJar 在其之上合并 shadowCommon/shadowBundle，作为最终产物。
jar {
	archiveClassifier.set("raw")
	from("${rootProject.projectDir}/LICENSE") {
		rename { "${it}_${base.archivesName.get()}"}
	}
}

shadowJar {
	dependsOn jar
	mainSpec.sourcePaths.clear()
	from(zipTree(jar.archiveFile))
	exclude "architectury.common.json"
	configurations = [project.configurations.shadowCommon, project.configurations.shadowBundle]
	archiveClassifier.set(null)
	relocate "javazoom", "com.shiroha.mmdskin.shadow.javazoom"

	// 排除不需要的文件
	exclude 'META-INF/versions/**'

	// 强制更新 META-INF/services 里的类名
	mergeServiceFiles()

	// 排除 module-info.class 避免 JPMS 冲突
	exclude 'module-info.class'
}

assemble.dependsOn shadowJar

sourcesJar {
    // Avoid duplicate entries when merging common sources
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

sourceSets {
    main {
        java {
            // Avoid JPMS split-package with shaded common (network package) in dev runtime
        }
        resources {
            exclude 'assets/mmdskin/lang/*.json'
            exclude 'pack.mcmeta'
        }
    }
}
